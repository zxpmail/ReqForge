# forge-smoke — ReqForge release gate (static + validate-skill + test-demo golden path)
# Triggers: push/PR only — no cron (see core/docs/platform-compliance.md)
name: forge-smoke

on:
  push:
    branches: [main, master]
    paths:
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - "tests/**"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "test-demo/**"
      - ".github/workflows/**"
      - "CLAUDE.md"
      - "package.json"
      - "pnpm-lock.yaml"
  pull_request:
    paths:
      - "core/**"
      - "adapters/**"
      - "scripts/**"
      - "tests/**"
      - "vitest.config.ts"
      - "tsconfig.json"
      - "test-demo/**"
      - ".github/workflows/**"
      - "CLAUDE.md"
      - "package.json"
      - "pnpm-lock.yaml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm build

      - name: Unit tests
        run: pnpm test

      - name: Run forge-smoke
        run: node scripts/forge-smoke/run-all.mjs
